<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Hitchly</title>
    <script>
      // GitHub Pages SPA redirect trick
      // Stores the current path and redirects to index.html
      // which then reads the path and navigates correctly
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1).join('/') + '/?p=' +
        encodeURIComponent(l.pathname + l.search) +
        (l.hash || '')
      );
    </script>
  </head>
  <body>
    Redirecting...
  </body>
</html>
